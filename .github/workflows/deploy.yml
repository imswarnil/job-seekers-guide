name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          # Without this the action ignores every failure and reports success —
          # which it did, silently, while `git pull` aborted on a conflict and
          # the site sat on a months-old commit. A deploy that cannot fail is
          # not a deploy.
          script_stop: true

          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_APP_DIR }}

            # fetch + reset, not pull. The server's checkout is a deploy
            # artefact, not a working copy: it should match origin/main exactly
            # and nothing on it is worth preserving. `git pull` aborts on any
            # local edit or colliding untracked file — which is precisely how
            # this broke.
            git fetch --prune origin main
            git reset --hard origin/main

            # Prove it landed, in the log, rather than assuming.
            git --no-pager log --oneline -1

            # `up -d` and not `restart`: restart reuses the existing container,
            # so a changed compose file or a new bind mount (the Apache
            # hardening conf, for one) would silently never take effect. `up -d`
            # recreates only what actually changed.
            docker compose -f docker/docker-compose.prod.yml --env-file docker/.env up -d wordpress

            # Warm the site so the plugin's upgrade routine runs immediately —
            # it is hooked on `init`, so any request triggers it. Deliberately
            # not wp-cli: it is not in the WordPress image, and a deploy step
            # that silently does nothing is worse than no deploy step.
            # Warm the site so the upgrade routine runs, and fail the deploy if
            # the front page does not come back. No `|| true`: a deploy that
            # leaves the site down must not be green.
            sleep 8
            curl -fsS -o /dev/null --max-time 30 https://${{ secrets.SITE_DOMAIN || 'jobseekers.imswarnil.com' }}/
