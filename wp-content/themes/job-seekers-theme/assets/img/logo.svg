<?xml version="1.0" encoding="UTF-8"?>
<!--
  Job Seekers Guide brand mark: a magnifying glass — the job search — with a
  briefcase inside the lens, the thing being searched for. Drawn on Phosphor's
  256 grid at matching stroke weights so it sits correctly beside the icon set.
  Single-colour (currentColor) so it inherits from whatever it is placed on.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="Job Seekers Guide">
  <!-- Lens -->
  <circle cx="106" cy="106" r="72" stroke="currentColor" stroke-width="18"/>
  <!-- Handle -->
  <path d="M158 158L214 214" stroke="currentColor" stroke-width="24" stroke-linecap="round"/>
  <!-- Briefcase handle -->
  <path d="M90 90V82a12 12 0 0 1 12-12h8a12 12 0 0 1 12 12v8" stroke="currentColor" stroke-width="13" stroke-linecap="round"/>
  <!-- Briefcase body, with a clasp notched out of the top edge -->
  <path d="M70 90h72a12 12 0 0 1 12 12v34a12 12 0 0 1-12 12H70a12 12 0 0 1-12-12v-34a12 12 0 0 1 12-12Zm28 22h16a4 4 0 0 1 0 8H98a4 4 0 0 1 0-8Z" fill="currentColor" fill-rule="evenodd"/>
</svg>
