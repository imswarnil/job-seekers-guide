<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon: the brand mark reversed out of a filled tile.
  Three ascending steps — a sequence going up, which is the thing this platform
  claims people were never given. Solid shapes and no strokes under 8px, because
  a favicon is drawn at 16 and anything finer turns to mud. Colours are literal:
  a favicon has no inherited context to take currentColor from.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Job Seekers Guide">
  <rect width="256" height="256" rx="56" fill="#4338CA"/>
  <rect x="46" y="150" width="46" height="62" rx="14" fill="#ffffff" opacity=".5"/>
  <rect x="105" y="106" width="46" height="106" rx="14" fill="#ffffff" opacity=".75"/>
  <rect x="164" y="62" width="46" height="150" rx="14" fill="#ffffff"/>
</svg>
