<svg class="guide-illus guide-illus--scenes" viewBox="0 0 520 420" fill="none" aria-hidden="true" focusable="false" stroke-linecap="round" stroke-linejoin="round">

	<!-- =====================================================================
	     Three scenes, cycled by CSS. The sequence is the argument the whole
	     platform makes, in the order it makes it:

	       1. Applications going out and nothing coming back.
	       2. A path, in order, with the steps completed one at a time.
	       3. The offer — and the door that only has to open once.

	     Everything is drawn with currentColor and opacity so the artwork
	     inherits the brand colour instead of pinning a second palette.
	     ===================================================================== -->

	<!-- ---------------------------------------------------------------- 1 -->
	<g class="sc sc--1">
		<rect class="sc__card" x="40" y="46" width="440" height="328" rx="20"/>

		<text class="sc__label" x="72" y="92">APPLICATIONS SENT</text>
		<text class="sc__big" x="72" y="150">74</text>
		<text class="sc__label sc__label--dim" x="164" y="150">replies: 9</text>

		<!-- A grid of applications, nearly all of them silent. -->
		<g class="sc__grid">
			<g class="sc__dots"><rect class="sc__dot-miss" style="--i:0" x="74" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:1" x="95" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:2" x="116" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-hit" style="--i:3" x="137" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:4" x="158" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:5" x="179" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:6" x="200" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:7" x="221" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:8" x="242" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:9" x="263" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:10" x="284" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-hit" style="--i:11" x="305" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:12" x="326" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:13" x="347" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:14" x="368" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:15" x="389" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:16" x="410" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:17" x="431" y="186" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:18" x="74" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:19" x="95" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:20" x="116" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:21" x="137" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:22" x="158" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:23" x="179" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:24" x="200" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:25" x="221" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:26" x="242" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-hit" style="--i:27" x="263" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:28" x="284" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:29" x="305" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:30" x="326" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:31" x="347" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:32" x="368" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:33" x="389" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-hit" style="--i:34" x="410" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:35" x="431" y="207" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:36" x="74" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:37" x="95" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:38" x="116" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:39" x="137" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:40" x="158" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-hit" style="--i:41" x="179" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:42" x="200" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:43" x="221" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:44" x="242" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:45" x="263" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:46" x="284" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:47" x="305" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:48" x="326" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:49" x="347" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:50" x="368" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:51" x="389" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-hit" style="--i:52" x="410" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:53" x="431" y="228" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:54" x="74" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:55" x="95" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:56" x="116" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:57" x="137" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-hit" style="--i:58" x="158" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:59" x="179" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:60" x="200" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:61" x="221" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:62" x="242" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-hit" style="--i:63" x="263" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:64" x="284" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:65" x="305" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:66" x="326" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:67" x="347" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:68" x="368" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:69" x="389" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-hit" style="--i:70" x="410" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:71" x="431" y="249" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:72" x="74" y="270" width="12" height="12" rx="3"/><rect class="sc__dot-miss" style="--i:73" x="95" y="270" width="12" height="12" rx="3"/></g>
		</g>

		<text class="sc__note" x="72" y="330">Eleven months. Same CV, same portals,</text>
		<text class="sc__note" x="72" y="352">no idea which part was wrong.</text>
	</g>

	<!-- ---------------------------------------------------------------- 2 -->
	<g class="sc sc--2">
		<rect class="sc__card" x="40" y="46" width="440" height="328" rx="20"/>

		<text class="sc__label" x="72" y="92">YOUR PATH</text>

		<!-- The spine. -->
		<line class="sc__spine" x1="92" y1="126" x2="92" y2="322"/>

		<g class="sc__step" style="--i:0">
			<circle class="sc__dot" cx="92" cy="132" r="11"/>
			<polyline class="sc__tick" points="86,132 90,136 98,127"/>
			<rect class="sc__bar" x="120" y="122" width="250" height="10" rx="5"/>
			<rect class="sc__bar sc__bar--sub" x="120" y="140" width="150" height="8" rx="4"/>
		</g>

		<g class="sc__step" style="--i:1">
			<circle class="sc__dot" cx="92" cy="196" r="11"/>
			<polyline class="sc__tick" points="86,196 90,200 98,191"/>
			<rect class="sc__bar" x="120" y="186" width="220" height="10" rx="5"/>
			<rect class="sc__bar sc__bar--sub" x="120" y="204" width="180" height="8" rx="4"/>
		</g>

		<g class="sc__step" style="--i:2">
			<circle class="sc__dot" cx="92" cy="260" r="11"/>
			<polyline class="sc__tick" points="86,260 90,264 98,255"/>
			<rect class="sc__bar" x="120" y="250" width="264" height="10" rx="5"/>
			<rect class="sc__bar sc__bar--sub" x="120" y="268" width="120" height="8" rx="4"/>
		</g>

		<g class="sc__step sc__step--next" style="--i:3">
			<circle class="sc__dot sc__dot--open" cx="92" cy="322" r="11"/>
			<rect class="sc__bar sc__bar--dim" x="120" y="312" width="190" height="10" rx="5"/>
		</g>
	</g>

	<!-- ---------------------------------------------------------------- 3 -->
	<g class="sc sc--3">
		<rect class="sc__card" x="40" y="46" width="440" height="328" rx="20"/>

		<text class="sc__label" x="72" y="92">OFFER</text>

		<!-- The door that only has to open once. -->
		<g class="sc__door">
			<path class="sc__door-frame" d="M300,300 V176 a56,56 0 0 1 112,0 V300"/>
			<path class="sc__door-leaf" d="M356,300 V126 a52,52 0 0 1 52,52 V300"/>
			<circle class="sc__door-knob" cx="368" cy="238" r="5"/>
		</g>

		<line class="sc__floor" x1="72" y1="300" x2="448" y2="300"/>

		<!-- The person walking through it. -->
		<g class="sc__figure">
			<circle cx="150" cy="228" r="15"/>
			<path d="M150,246 v34"/>
			<path d="M150,258 l-20,14 M150,258 l20,14"/>
			<path d="M150,280 l-16,20 M150,280 l16,20"/>
		</g>

		<text class="sc__note" x="72" y="344">The fresher tag is a door you only</text>
		<text class="sc__note" x="72" y="366">need opened once.</text>
	</g>
</svg>
