# Server-level hardening.
#
# These rules have to live here rather than in the plugin: the files below are
# static, so Apache serves them directly and PHP never runs. No amount of
# WordPress code can intercept a request that never reaches WordPress.
#
# Mounted into /etc/apache2/conf-enabled/ by both the local and production
# compose files, so the two environments cannot drift apart on this.

# ---------------------------------------------------------------------------
# Version fingerprinting
# ---------------------------------------------------------------------------
# readme.html states the exact WordPress version. It is the first thing an
# automated scanner reads to decide which exploits are worth trying.
<FilesMatch "^(readme\.html|license\.txt|wp-config-sample\.php)$">
    Require all denied
</FilesMatch>

# Apache's own version and OS in the Server header and error pages.
ServerTokens Prod
ServerSignature Off

# ---------------------------------------------------------------------------
# Files that should never be fetchable
# ---------------------------------------------------------------------------
# Editor backups, VCS metadata, dependency manifests, dotfiles, and database
# dumps. Any of these being readable is a bad day.
<FilesMatch "(^\.|\.(bak|old|orig|save|swp|sql|sqlite|log|env|ini|conf|dist|lock|json|yml|yaml)$|~$)">
    Require all denied
</FilesMatch>

# package.json et al. are needed by nobody over HTTP, but composer.json and
# node_modules leaking a dependency tree tells an attacker exactly what to
# target. Blocked wholesale.
<DirectoryMatch "/(\.git|\.github|node_modules|vendor|src)/">
    Require all denied
</DirectoryMatch>

# ---------------------------------------------------------------------------
# PHP execution in upload directories
# ---------------------------------------------------------------------------
# The single highest-value protection here. If a file upload is ever mishandled
# anywhere in the stack, this is what stops the uploaded file being executed.
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.(?i:php|phtml|php3|php4|php5|php7|php8|phps)$">
        Require all denied
    </FilesMatch>
</Directory>

# ---------------------------------------------------------------------------
# XML-RPC
# ---------------------------------------------------------------------------
# The plugin already returns 403, but refusing at the server saves PHP being
# started at all for what is usually a brute-force amplification attempt.
<Files "xmlrpc.php">
    Require all denied
</Files>

# ---------------------------------------------------------------------------
# Directory listings
# ---------------------------------------------------------------------------
Options -Indexes
